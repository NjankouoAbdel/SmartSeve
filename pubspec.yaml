name: wfer_flousk_firebase
description: "SMART SAVE Expense Manager Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.1.1
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.3.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^11.1.0
  animations: ^2.0.11
  flutter_local_notifications: ^19.4.2
  local_auth: ^2.3.0
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  google_mlkit_text_recognition: ^0.15.0
  csv: ^6.0.0
  file_picker: ^10.3.3
  in_app_purchase: ^3.2.3
  excel: ^4.0.6
  gsheets: ^0.5.0
  home_widget: ^0.7.0+1
  firebase_core: ^4.2.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_crashlytics: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/Logo.jpeg
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/Logo.jpeg
  android: true
  ios: false
